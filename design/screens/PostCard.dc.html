<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Karta orlího pera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<article style="position: relative; width: 358px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 16px; overflow: hidden; font-family: Inter, system-ui, -apple-system, sans-serif; color: #1F3A1A">

  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; font: 700 16px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{p.ini}}</div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font: 600 14px/20px Inter, system-ui, sans-serif">{{p.name}}</span>
      <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">{{p.place}} · {{p.time}}</span>
    </div>
    <a href="Domu-MenuPrispevku.dc.html" aria-label="Další možnosti" style="width: 44px; height: 44px; margin: -10px -12px -10px 0; flex-shrink: 0; border-radius: 12px; color: #5E6B57; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; background: {{lt.tint}}; color: {{lt.dark}}; font: 600 13px/18px Inter, system-ui, sans-serif"><span style="font: 800 13px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{lt.roman}}</span>{{p.cat}}</span>
      <sc-if value="{{p.gc}}" hint-placeholder-val="{{ true }}">
        <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 10px; border-radius: 7px; background: #FCEFB4; color: #5A4200; font: 800 12px/16px Inter, system-ui, sans-serif; letter-spacing: 0.8px; text-transform: uppercase"><svg width="13" height="13" viewBox="0 0 24 24" fill="#B88A0E" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"></path></svg>Grand challenge</span>
      </sc-if>
    </div>
    <h3 style="margin: 0; font: 700 22px/28px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{p.title}}</h3>
  </div>

  <sc-if value="{{hasMetrics}}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{metrics}}" as="m" hint-placeholder-count="1">
        <div style="display: flex; flex-direction: column; gap: 0">
          <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">{{m.label}}</span>
          <span style="display: flex; align-items: baseline; gap: 4px; font: 800 32px/38px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: -0.5px">{{m.value}}<span style="font: 700 20px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: 0">{{m.unit}}</span></span>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 7px; background: #E2EFE2; color: #2B6A2E; font: 600 13px/18px Inter, system-ui, sans-serif"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Splněno</span>
  </sc-if>

  <sc-if value="{{ph1}}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="Fotka k peru" style="height: 244px; border-radius: 12px; background: #C6CBBD; color: #8C9585; display: flex; align-items: center; justify-content: center">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>
    </div>
  </sc-if>
  <sc-if value="{{ph2}}" hint-placeholder-val="{{ false }}">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div role="img" aria-label="Fotka 1" style="height: 159px; border-radius: 12px; background: #C6CBBD; color: #8C9585; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg></div>
      <div role="img" aria-label="Fotka 2" style="height: 159px; border-radius: 12px; background: #BDC3B2; color: #858E7D; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg></div>
    </div>
  </sc-if>
  <sc-if value="{{ph3}}" hint-placeholder-val="{{ false }}">
    <div style="display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 96px 96px; gap: 8px">
      <div role="img" aria-label="Fotka 1" style="grid-row: span 2; border-radius: 12px; background: #C6CBBD; color: #8C9585; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg></div>
      <div role="img" aria-label="Fotka 2" style="border-radius: 12px; background: #BDC3B2"></div>
      <button type="button" aria-label="Zobrazit další fotky" style="position: relative; padding: 0; border: 0; border-radius: 12px; background: #CDD1C4; overflow: hidden">
        <span style="position: absolute; inset: 0; background: rgba(31,58,26,0.62); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font: 800 26px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{more}}</span>
      </button>
    </div>
  </sc-if>

  <div style="display: flex; align-items: center; margin: -4px -6px -8px; padding-top: 4px; border-top: 1px solid #DEDDD2">
    <sc-if value="{{liked}}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-pressed="true" aria-label="Odebrat pírko" onClick="{{toggleLike}}" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px 0 10px; margin-top: 4px; border: 0; border-radius: 999px; background: #FCEBD9; color: #C9661A; font: 700 14px/20px Inter, system-ui, sans-serif; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z" fill="#E07B1F" stroke="#E07B1F" stroke-width="2"></path><path d="M3.5 20.5 7 17" stroke="#E07B1F" stroke-width="2"></path><path d="M8.5 15.5 15 9" stroke="#FCEBD9" stroke-width="1.6"></path></svg>
        {{count}}
      </button>
    </sc-if>
    <sc-if value="{{notLiked}}" hint-placeholder-val="{{ true }}">
      <button type="button" aria-pressed="false" aria-label="Dát pírko" onClick="{{toggleLike}}" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px 0 10px; margin-top: 4px; border: 0; border-radius: 999px; background: transparent; color: #1F3A1A; font: 600 14px/20px Inter, system-ui, sans-serif; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F3A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z"></path><path d="M3.5 20.5 15 9"></path></svg>
        {{count}}
      </button>
    </sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"post":{"editor":null},"$preview":{"width":358,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    var sample = {
      name: 'Tereza Svobodová', ini: 'TS', tint: '#DDE8D2',
      place: 'Choltice, Pardubický kraj', time: 'dnes 9:00',
      cat: 'Atletika – běhy', color: '#5B8C3A', title: 'Běh na 100 m', gc: true,
      metrics: [{ label: 'Čas', value: '11,25', unit: 's' }],
      photos: 1, likes: 24, liked: false
    };
    var p = Object.assign({}, sample, this.props.post || {});
    var st = this.state || {};
    var liked = typeof st.liked === 'boolean' ? st.liked : !!p.liked;
    var base = p.likes || 0;
    var count = base + (liked && !p.liked ? 1 : 0) - (!liked && p.liked ? 1 : 0);
    var metrics = p.metrics || [];
    var n = p.photos || 0;
    var self = this;
    var LIGHTS = {
      '#5B8C3A': { roman: 'I', tint: '#E3ECDA', dark: '#2F5A1A' },
      '#3D7EA6': { roman: 'II', tint: '#DCE9F1', dark: '#1F4E6B' },
      '#B5523B': { roman: 'III', tint: '#F3E0DA', dark: '#7A2E1E' },
      '#D4A017': { roman: 'IV', tint: '#F6ECCB', dark: '#6B4F00' }
    };
    var lt = LIGHTS[String(p.color || '').toUpperCase()] || LIGHTS['#5B8C3A'];
    return {
      p: p,
      lt: lt,
      metrics: metrics,
      hasMetrics: metrics.length > 0,
      done: metrics.length === 0,
      ph1: n === 1, ph2: n === 2, ph3: n >= 3,
      more: '+' + Math.max(n - 3, 0),
      liked: liked, notLiked: !liked, count: count,
      toggleLike: function () { self.setState({ liked: !liked }); }
    };
  }
}
</script>
</body>
</html>
