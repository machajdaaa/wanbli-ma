<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Menu vlastního příspěvku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F2; color: #1F3A1A; font-family: Inter, system-ui, -apple-system, sans-serif">
  <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 60px 16px 0">
    <h1 style="margin: 0; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Moje příspěvky</h1>
    <dc-import name="PostCard" post="{{post}}" hint-size="358px,520px"></dc-import>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,36,16,0.48)"></div>

  <section role="dialog" aria-label="Možnosti příspěvku" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px 34px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 32px rgba(20,36,16,0.18); display: flex; flex-direction: column; gap: 8px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #DEDDD2; margin-bottom: 8px"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px 12px; border-bottom: 1px solid #ECEBE3">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F4E8C1; display: flex; align-items: center; justify-content: center; font: 700 16px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">JN</div>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font: 600 14px/20px Inter, system-ui, sans-serif">Tvůj příspěvek</span>
        <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Hod míčkem · včera 17:20</span>
      </div>
    </div>

    <nav style="display: flex; flex-direction: column">
      <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 4px; border: 0; background: transparent; color: #1F3A1A; text-align: left">
        <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #F0EFE6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font: 500 16px/22px Inter, system-ui, sans-serif">Upravit příspěvek</span><span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Fotky a výkon</span></span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 4px; border: 0; border-top: 1px solid #ECEBE3; background: transparent; color: #C8442F; text-align: left">
        <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #FBE7E3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font: 600 16px/22px Inter, system-ui, sans-serif">Smazat příspěvek</span><span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Pero ti ve sbírce zůstane</span></span>
      </button>
    </nav>

    <button type="button" style="height: 52px; margin-top: 4px; border-radius: 12px; border: 2px solid #DEDDD2; background: #F0EFE6; color: #1F3A1A; font: 600 16px/20px Inter, system-ui, sans-serif">Zrušit</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      post: { name: 'Jakub Novák', ini: 'JN', tint: '#F4E8C1', place: 'Choltice, Pardubický kraj', time: 'včera 17:20', cat: 'Hody, vrhy a kopy', color: '#5B8C3A', title: 'Hod míčkem', gc: false, metrics: [{ label: 'Vzdálenost', value: '34', unit: 'm' }], photos: 1, likes: 14 }
    };
  }
}
</script>
</body>
</html>
