<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Můj profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1700px; overflow: hidden; background: #F7F6F2; color: #1F3A1A; font-family: Inter, system-ui, -apple-system, sans-serif">
  <main style="display: flex; flex-direction: column; gap: 24px; padding: 52px 16px 140px">
    <div style="display: flex; justify-content: flex-end">
      <a href="Nastaveni.dc.html" aria-label="Nastavení" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #DEDDD2; box-sizing: border-box; color: #1F3A1A; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </a>
    </div>

    <section style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-top: -32px">
      <div style="width: 96px; height: 96px; border-radius: 30px; background: #F4E8C1; display: flex; align-items: center; justify-content: center; font: 800 36px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">JN</div>
      <h1 style="margin: 6px 0 0; font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Jakub Novák</h1>
      <div style="display: flex; align-items: center; gap: 8px; font: 500 14px/20px Inter, system-ui, sans-serif; color: #5E6B57">
        <span>Kuba</span>
        <span aria-hidden="true">·</span>
        <a href="Skupina-Prispevky.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DEDDD2; color: #1F3A1A; text-decoration: none; font: 600 13px/18px Inter, system-ui, sans-serif"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Trilobit</a>
      </div>
      <p style="margin: 4px 0 0; max-width: 310px; font: 400 14px/20px Inter, system-ui, sans-serif; color: #5E6B57">Běhám, stopuju a sbírám pera z atletiky. Letos chci mít celé 1. světlo.</p>
    </section>

    <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 16px; overflow: hidden">
      <div style="display: flex; flex-direction: column-reverse; align-items: center; gap: 0; padding: 12px 8px; border-right: 1px solid #DEDDD2">
        <dt style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Orlí pera</dt>
        <dd style="margin: 0; display: inline-flex; align-items: center; gap: 4px; font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E07B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z"></path><path d="M3.5 20.5 15 9"></path></svg>18</dd>
      </div>
      <a href="#" style="display: flex; flex-direction: column-reverse; align-items: center; padding: 12px 8px; border-right: 1px solid #DEDDD2; text-decoration: none; color: #1F3A1A">
        <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Sledující</span>
        <span style="font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">42</span>
      </a>
      <a href="#" style="display: flex; flex-direction: column-reverse; align-items: center; padding: 12px 8px; text-decoration: none; color: #1F3A1A">
        <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Sleduji</span>
        <span style="font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">35</span>
      </a>
    </dl>

    <a href="UpravitProfil.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; margin-top: -8px; border-radius: 12px; border: 2px solid #DEDDD2; background: #F0EFE6; color: #1F3A1A; text-decoration: none; font: 600 16px/20px Inter, system-ui, sans-serif">Upravit profil</a>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Moje sbírka</h2>
        <a href="OrliPera.dc.html" style="font: 600 14px/20px Inter, system-ui, sans-serif; color: #1F3A1A; text-decoration: underline; text-decoration-color: #E07B1F; text-decoration-thickness: 2px; text-underline-offset: 4px">Všechna pera</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px; background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 16px">
        <sc-for list="{{lights}}" as="l" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="display: inline-flex; align-items: center; gap: 8px; font: 600 14px/20px Inter, system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{l.color}}"></span>{{l.name}}</span>
              <span style="font: 700 16px/20px 'Baloo 2', system-ui, sans-serif">{{l.done}}<span style="font: 500 13px/20px Inter, system-ui, sans-serif; color: #5E6B57"> / {{l.all}}</span></span>
            </div>
            <div style="height: 8px; border-radius: 999px; background: #E2E1D6; overflow: hidden"><div style="height: 100%; width: {{l.pct}}; border-radius: 999px; background: {{l.color}}"></div></div>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Moje příspěvky</h2>
      <sc-for list="{{posts}}" as="it" hint-placeholder-count="2">
        <dc-import name="PostCard" post="{{it}}" hint-size="358px,480px"></dc-import>
      </sc-for>
    </section>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(180deg, rgba(247,246,242,0) 0%, rgba(247,246,242,0.92) 55%, #F7F6F2 100%)"></div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 116px">
    <dc-import name="NavBar" active="profil" hint-size="390px,116px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    var L = function (name, color, done, all) { return { name: name, color: color, done: done, all: all, pct: Math.round(done / all * 100) + '%' }; };
    var me = { name: 'Jakub Novák', ini: 'JN', tint: '#F4E8C1', place: 'Choltice, Pardubický kraj' };
    return {
      lights: [L('1. světlo', '#5B8C3A', 7, 36), L('2. světlo', '#3D7EA6', 5, 41), L('3. světlo', '#B5523B', 3, 36), L('4. světlo', '#D4A017', 3, 33)],
      posts: [
        Object.assign({}, me, { time: 'včera 17:20', cat: 'Hody, vrhy a kopy', color: '#5B8C3A', title: 'Hod míčkem', gc: false, metrics: [{ label: 'Vzdálenost', value: '34', unit: 'm' }], photos: 1, likes: 14 }),
        Object.assign({}, me, { time: '3. 10. 11:00', cat: 'Uzly a lana', color: '#B5523B', title: 'Uvaž 10 uzlů poslepu', gc: false, metrics: [], photos: 0, likes: 8 })
      ]
    };
  }
}
</script>
</body>
</html>
