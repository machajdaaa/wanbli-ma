  <main style="display: flex; flex-direction: column; gap: 20px; padding: 60px 16px 140px">

      <h2 style="margin: 0; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Od kamarádů</h2>
      <sc-for list="{{posts}}" as="it" hint-placeholder-count="3">
        <dc-import name="PostCard" post="{{it}}" hint-size="358px,480px"></dc-import>
      </sc-for>
    </div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(180deg, rgba(247,246,242,0) 0%, rgba(247,246,242,0.92) 55%, #F7F6F2 100%)"></div>

    <dc-import name="NavBar" active="domu" hint-size="390px,116px"></dc-import>
  </div>
</div>
</x-dc>
