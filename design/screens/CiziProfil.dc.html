<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Profil – Tereza Svobodová</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1600px; overflow: hidden; background: #F7F6F2; color: #1F3A1A; font-family: Inter, system-ui, -apple-system, sans-serif">
  <main style="display: flex; flex-direction: column; gap: 24px; padding: 52px 16px 140px">
    <div style="display: flex; justify-content: flex-start">
      <a href="Hledani.dc.html" aria-label="Zpět" style="width: 44px; height: 44px; margin-left: -6px; border-radius: 50%; color: #1F3A1A; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
      </a>
    </div>

    <section style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-top: -32px">
      <div style="width: 96px; height: 96px; border-radius: 30px; background: #DDE8D2; display: flex; align-items: center; justify-content: center; font: 800 36px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">TS</div>
      <h1 style="margin: 6px 0 0; font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Tereza Svobodová</h1>
      <div style="display: flex; align-items: center; gap: 8px; font: 500 14px/20px Inter, system-ui, sans-serif; color: #5E6B57">
        <span>Terka</span>
        <span aria-hidden="true">·</span>
        <a href="Skupina-Prispevky.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DEDDD2; color: #1F3A1A; text-decoration: none; font: 600 13px/18px Inter, system-ui, sans-serif"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Trilobit</a>
      </div>
      <p style="margin: 4px 0 0; max-width: 310px; font: 400 14px/20px Inter, system-ui, sans-serif; color: #5E6B57">Sprinty, lezení a noční hry. Sbírám grand challenge.</p>
    </section>

    <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 16px; overflow: hidden">
      <div style="display: flex; flex-direction: column-reverse; align-items: center; padding: 12px 8px; border-right: 1px solid #DEDDD2">
        <dt style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Orlí pera</dt>
        <dd style="margin: 0; display: inline-flex; align-items: center; gap: 4px; font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E07B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z"></path><path d="M3.5 20.5 15 9"></path></svg>64</dd>
      </div>
      <a href="#" style="display: flex; flex-direction: column-reverse; align-items: center; padding: 12px 8px; border-right: 1px solid #DEDDD2; text-decoration: none; color: #1F3A1A">
        <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Sledující</span>
        <span style="font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{followers}}</span>
      </a>
      <a href="#" style="display: flex; flex-direction: column-reverse; align-items: center; padding: 12px 8px; text-decoration: none; color: #1F3A1A">
        <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Sleduje</span>
        <span style="font: 800 26px/32px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">52</span>
      </a>
    </dl>

    <sc-if value="{{notFollowing}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{toggle}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; margin-top: -8px; border-radius: 12px; border: 1.5px solid #C9661A; background: #E07B1F; color: #FFFFFF; font: 600 16px/20px Inter, system-ui, sans-serif; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>Sledovat</button>
    </sc-if>
    <sc-if value="{{following}}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-pressed="true" onClick="{{toggle}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; margin-top: -8px; border-radius: 12px; border: 2px solid #DEDDD2; background: #F0EFE6; color: #1F3A1A; font: 600 16px/20px Inter, system-ui, sans-serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E8E41" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Sleduješ</button>
    </sc-if>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Sbírka</h2>
      <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px; background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 16px">
        <sc-for list="{{lights}}" as="l" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="display: inline-flex; align-items: center; gap: 8px; font: 600 14px/20px Inter, system-ui, sans-serif"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{l.color}}"></span>{{l.name}}</span>
              <span style="font: 700 16px/20px 'Baloo 2', system-ui, sans-serif">{{l.done}}<span style="font: 500 13px/20px Inter, system-ui, sans-serif; color: #5E6B57"> / {{l.all}}</span></span>
            </div>
            <div style="height: 8px; border-radius: 999px; background: #E2E1D6; overflow: hidden"><div style="height: 100%; width: {{l.pct}}; border-radius: 999px; background: {{l.color}}"></div></div>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Příspěvky</h2>
      <sc-for list="{{posts}}" as="it" hint-placeholder-count="1">
        <dc-import name="PostCard" post="{{it}}" hint-size="358px,540px"></dc-import>
      </sc-for>
    </section>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(180deg, rgba(247,246,242,0) 0%, rgba(247,246,242,0.92) 55%, #F7F6F2 100%)"></div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 116px">
    <dc-import name="NavBar" active="domu" hint-size="390px,116px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var on = !!st.following;
    var L = function (name, color, done, all) { return { name: name, color: color, done: done, all: all, pct: Math.round(done / all * 100) + '%' }; };
    return {
      following: on, notFollowing: !on,
      followers: on ? 88 : 87,
      toggle: function () { self.setState({ following: !on }); },
      lights: [L('1. světlo', '#5B8C3A', 22, 36), L('2. světlo', '#3D7EA6', 18, 41), L('3. světlo', '#B5523B', 12, 36), L('4. světlo', '#D4A017', 12, 33)],
      posts: [
        { name: 'Tereza Svobodová', ini: 'TS', tint: '#DDE8D2', place: 'Choltice, Pardubický kraj', time: 'dnes 9:00', cat: 'Atletika – běhy', color: '#5B8C3A', title: 'Běh na 100 m', gc: true, metrics: [{ label: 'Čas', value: '11,25', unit: 's' }], photos: 1, likes: 24 }
      ]
    };
  }
}
</script>
</body>
</html>
