<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Vyhledávání lidí</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F2; color: #1F3A1A; font-family: Inter, system-ui, -apple-system, sans-serif">
  <header style="display: flex; align-items: center; gap: 6px; padding: 52px 16px 8px 10px">
    <a href="Domu.dc.html" aria-label="Zpět" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; color: #1F3A1A; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </a>
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid #E07B1F; box-shadow: 0 0 0 4px #FCEBD9; background: #FFFFFF; color: #5E6B57">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hledat lidi</label>
      <input id="q" placeholder="Hledej kamarády podle jména" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #1F3A1A; font: 400 16px/20px Inter, system-ui, sans-serif">
    </div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 40px">
    <h1 style="margin: 0 0 4px; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Návrhy ze tvé skupiny</h1>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DEDDD2; border-radius: 16px; overflow: hidden">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
        <li style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 12px 0 14px; border-bottom: 1px solid #ECEBE3">
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; font: 700 16px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{p.ini}}</div>
          <a href="CiziProfil.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-decoration: none; color: #1F3A1A">
            <span style="font: 600 14px/20px Inter, system-ui, sans-serif">{{p.name}}</span>
            <span style="display: inline-flex; align-items: center; gap: 4px; font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Trilobit<span aria-hidden="true">·</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z"></path><path d="M3.5 20.5 15 9"></path></svg>{{p.n}} per</span>
          </a>
          <sc-if value="{{p.following}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" onClick="{{p.toggle}}" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px 0 12px; border-radius: 12px; border: 2px solid #DEDDD2; background: #F0EFE6; color: #1F3A1A; font: 600 14px/20px Inter, system-ui, sans-serif; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3E8E41" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Sleduješ</button>
          </sc-if>
          <sc-if value="{{p.notFollowing}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-pressed="false" onClick="{{p.toggle}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #C9661A; background: #E07B1F; color: #FFFFFF; font: 600 14px/20px Inter, system-ui, sans-serif; cursor: pointer">Sledovat</button>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var base = [
      { id: 'ts', name: 'Tereza Svobodová', ini: 'TS', tint: '#DDE8D2', n: 64, f: true },
      { id: 'md', name: 'Matěj Dvořák', ini: 'MD', tint: '#F4E8C1', n: 58, f: false },
      { id: 'ec', name: 'Eliška Černá', ini: 'EČ', tint: '#E2E5DA', n: 51, f: true },
      { id: 'vp', name: 'Vojtěch Procházka', ini: 'VP', tint: '#D6E6EF', n: 47, f: false },
      { id: 'ak', name: 'Anežka Kučerová', ini: 'AK', tint: '#F1DCD5', n: 44, f: false },
      { id: 'sn', name: 'Šimon Němec', ini: 'ŠN', tint: '#D6E6EF', n: 36, f: false },
      { id: 'km', name: 'Klára Marková', ini: 'KM', tint: '#F1DCD5', n: 33, f: false },
      { id: 'ap', name: 'Adam Pokorný', ini: 'AP', tint: '#E2E5DA', n: 31, f: false },
      { id: 'np', name: 'Natálie Pospíšilová', ini: 'NP', tint: '#DDE8D2', n: 29, f: false }
    ];
    var people = base.map(function (p) {
      var on = typeof st[p.id] === 'boolean' ? st[p.id] : p.f;
      return Object.assign({}, p, {
        following: on, notFollowing: !on,
        toggle: function () { var o = {}; o[p.id] = !on; self.setState(o); }
      });
    });
    return { people: people };
  }
}
</script>
</body>
</html>
