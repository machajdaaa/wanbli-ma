<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Registrace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; overflow: hidden; background: #F7F6F2; color: #1F3A1A; font-family: Inter, system-ui, -apple-system, sans-serif">
  <header style="display: flex; flex-direction: column; gap: 4px; padding: 52px 16px 0">
    <a href="Prihlaseni.dc.html" aria-label="Zpět na přihlášení" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; color: #1F3A1A; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </a>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 4px">
        <h1 style="margin: 0; font: 800 32px/36px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: -0.3px">Nový účet</h1>
        <p style="margin: 0; font: 400 15px/20px Inter, system-ui, sans-serif; color: #5E6B57">Pár údajů a můžeš sbírat pera.</p>
      </div>
      <img src="../assets/eagle-auth.png" alt="" style="width: 84px; height: 70px; flex-shrink: 0">

    </div>
  </header>

  <form style="display: flex; flex-direction: column; gap: 16px; padding: 24px 16px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="r-name" style="font: 600 14px/20px Inter, system-ui, sans-serif">Jméno a příjmení</label>
      <input id="r-name" autocomplete="name" value="Jakub Novák" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #DEDDD2; background: #FFFFFF; color: #1F3A1A; font: 400 16px/20px Inter, system-ui, sans-serif">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="r-nick" style="font: 600 14px/20px Inter, system-ui, sans-serif">Přezdívka</label>
      <input id="r-nick" autocomplete="nickname" value="Kuba" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #DEDDD2; background: #FFFFFF; color: #1F3A1A; font: 400 16px/20px Inter, system-ui, sans-serif">
      <span style="font: 500 12px/16px Inter, system-ui, sans-serif; color: #5E6B57">Uvidí ji ostatní u tvých per a v žebříčku.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="r-mail" style="font: 600 14px/20px Inter, system-ui, sans-serif">E-mail</label>
      <input id="r-mail" type="email" autocomplete="email" value="kuba.novak@email.cz" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #DEDDD2; background: #FFFFFF; color: #1F3A1A; font: 400 16px/20px Inter, system-ui, sans-serif">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="r-pass" style="font: 600 14px/20px Inter, system-ui, sans-serif">Heslo</label>
      <input id="r-pass" type="password" autocomplete="new-password" value="sovaVnoci42" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid #E07B1F; box-shadow: 0 0 0 4px #FCEBD9; background: #FFFFFF; color: #1F3A1A; font: 400 16px/20px Inter, system-ui, sans-serif">
      <span style="display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px Inter, system-ui, sans-serif; color: #2B6A2E"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Aspoň 8 znaků</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="r-group" style="font: 600 14px/20px Inter, system-ui, sans-serif">Tvůj oddíl</label>
      <div style="position: relative">
        <select id="r-group" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 44px 0 14px; border-radius: 12px; border: 1px solid #DEDDD2; background: #FFFFFF; color: #1F3A1A; font: 400 16px/20px Inter, system-ui, sans-serif; appearance: none; -webkit-appearance: none">
          <option>Trilobit · Choltice, Pardubický kraj</option>
          <option>Jiný oddíl…</option>
        </select>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 14px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font: 400 14px/20px Inter, system-ui, sans-serif">
      <input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #E07B1F">
      <span>Souhlasím s <a href="#" style="color: #1F3A1A; font-weight: 600; text-decoration: underline; text-decoration-color: #E07B1F; text-decoration-thickness: 2px; text-underline-offset: 3px">podmínkami používání</a></span>
    </label>

    <div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #FCEBD9">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9661A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
      <span style="font: 400 14px/20px Inter, system-ui, sans-serif">Je ti méně než 15? Po registraci pošleme e-mail rodiči, aby tvůj účet potvrdil.</span>
    </div>

    <a href="Domu-Nesleduji.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; margin-top: 4px; border-radius: 12px; border: 1.5px solid #C9661A; background: #E07B1F; color: #FFFFFF; text-decoration: none; font: 600 16px/20px Inter, system-ui, sans-serif">Vytvořit účet</a>
  </form>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 400 14px/20px Inter, system-ui, sans-serif; color: #5E6B57">
    Už máš účet?
    <a href="Prihlaseni.dc.html" style="display: inline-flex; align-items: center; height: 44px; color: #1F3A1A; font: 600 14px/20px Inter, system-ui, sans-serif; text-decoration: underline; text-decoration-color: #E07B1F; text-decoration-thickness: 2px; text-underline-offset: 4px">Přihlas se</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
