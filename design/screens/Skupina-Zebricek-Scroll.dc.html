<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Žebříček po scrollu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F7F6F2; color: #1F3A1A; font-family: Inter, system-ui, -apple-system, sans-serif">
  <main style="padding: 128px 16px 220px">
    <ol start="7" aria-label="Pořadí" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
        <li style="display: flex; align-items: center; gap: 12px; height: 64px; box-sizing: border-box; padding: 0 16px 0 12px; background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 16px">
          <span style="width: 36px; font: 800 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; color: #5E6B57">#{{r.rank}}</span>
          <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; font: 700 16px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">{{r.ini}}</div>
          <span style="flex: 1; min-width: 0; font: 600 14px/20px Inter, system-ui, sans-serif">{{r.name}}</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z"></path><path d="M3.5 20.5 15 9"></path></svg>{{r.n}}</span>
        </li>
      </sc-for>
    </ol>
  </main>

  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 52px 16px 12px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #DEDDD2; box-shadow: 0 4px 16px rgba(31,58,26,0.06)">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px">
      <div style="width: 28px; height: 28px; border-radius: 9px; background: #FCEBD9; display: flex; align-items: center; justify-content: center; font: 800 15px/1 'Baloo 2', system-ui, sans-serif; color: #C9661A">T</div>
      <span style="font: 800 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">Trilobit</span>
    </div>
    <nav role="tablist" aria-label="Obsah skupiny" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; height: 52px; box-sizing: border-box; background: #F0EFE6; border: 1px solid #DEDDD2; border-radius: 999px">
      <a href="Skupina-Prispevky.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #1F3A1A; text-decoration: none; font: 600 14px/20px Inter, system-ui, sans-serif">Příspěvky</a>
      <a href="Skupina-Oznameni.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #1F3A1A; text-decoration: none; font: 600 14px/20px Inter, system-ui, sans-serif">Oznámení</a>
      <a href="Skupina-Zebricek.dc.html" role="tab" aria-selected="true" style="display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #E07B1F; color: #FFFFFF; text-decoration: none; font: 600 14px/20px Inter, system-ui, sans-serif; box-shadow: 0 1px 0 #C9661A">Žebříček</a>
    </nav>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(180deg, rgba(247,246,242,0) 0%, rgba(247,246,242,0.92) 45%, #F7F6F2 100%)"></div>
  <div aria-label="Tvoje pozice" style="position: absolute; left: 16px; right: 16px; bottom: 126px; display: flex; align-items: center; gap: 12px; height: 64px; box-sizing: border-box; padding: 0 16px 0 12px; background: #FCEBD9; border: 1.5px solid #E07B1F; border-radius: 16px; box-shadow: 0 8px 20px rgba(201,102,26,0.18)">
    <span style="width: 36px; font: 800 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; color: #1F3A1A">#23</span>
    <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F4E8C1; display: flex; align-items: center; justify-content: center; font: 700 16px/1 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif">JN</div>
    <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px"><span style="font: 600 14px/20px Inter, system-ui, sans-serif">Jakub Novák</span><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 7px; background: #C9661A; color: #FFFFFF; font: 700 12px/16px Inter, system-ui, sans-serif">Ty</span></span>
    <span style="display: inline-flex; align-items: center; gap: 4px; font: 700 18px/24px 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E07B1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-7.5.3-12.6 5.2-13 12.5L7 20l3.4-.1C17.4 19.4 20.5 12 20 4Z"></path><path d="M3.5 20.5 15 9"></path></svg>18</span>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 116px">
    <dc-import name="NavBar" active="skupina" hint-size="390px,116px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var r = function (rank, name, ini, tint, n) { return { rank: rank, name: name, ini: ini, tint: tint, n: n }; };
    return { rows: [
      r(7, 'Barbora Horáková', 'BH', '#F4E8C1', 39),
      r(8, 'Šimon Němec', 'ŠN', '#D6E6EF', 36),
      r(9, 'Klára Marková', 'KM', '#F1DCD5', 33),
      r(10, 'Adam Pokorný', 'AP', '#E2E5DA', 31),
      r(11, 'Natálie Pospíšilová', 'NP', '#DDE8D2', 29),
      r(12, 'Tomáš Hájek', 'TH', '#F4E8C1', 27),
      r(13, 'Julie Králová', 'JK', '#D6E6EF', 26),
      r(14, 'Filip Jelínek', 'FJ', '#F1DCD5', 25),
      r(15, 'Kristýna Urbanová', 'KU', '#E2E5DA', 24)
    ] };
  }
}
</script>
</body>
</html>
