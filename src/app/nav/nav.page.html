<ion-tabs>
  <!-- Fade from the content into the background under the floating navbar. -->
  <div
    slot="bottom"
    aria-hidden="true"
    class="pointer-events-none absolute inset-x-0 bottom-0 z-[9] h-[calc(130px+var(--ion-safe-area-bottom,0px))] bg-[image:var(--wanbli-gradient-navbar-fade)]"
  ></div>

  <ion-tab-bar slot="bottom" [attr.aria-label]="'nav.label' | transloco">
    <ion-tab-button tab="home" href="/nav/home" [attr.aria-label]="'nav.home' | transloco">
      <app-icon name="home" [size]="26" class="tab-icon-default" />
      <app-icon name="home-filled" [size]="26" class="tab-icon-selected" />
    </ion-tab-button>

    <ion-tab-button tab="eagle-feathers" href="/nav/eagle-feathers" [attr.aria-label]="'nav.eagleFeathers' | transloco">
      <app-icon name="feather" [size]="26" class="tab-icon-default" />
      <app-icon name="feather-filled" [size]="26" class="tab-icon-selected" />
    </ion-tab-button>

    <!-- Space for the center button (76 px column in the design). -->
    <div class="nav-fab-slot" aria-hidden="true"></div>

    <ion-tab-button tab="group" href="/nav/group" [attr.aria-label]="'nav.group' | transloco">
      <app-icon name="group" [size]="26" class="tab-icon-default" />
      <app-icon name="group-filled" [size]="26" class="tab-icon-selected" />
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/nav/profile" [attr.aria-label]="'nav.profile' | transloco">
      <app-icon name="profile" [size]="26" class="tab-icon-default" />
      <app-icon name="profile-filled" [size]="26" class="tab-icon-selected" />
    </ion-tab-button>

    <button type="button" class="nav-fab" [attr.aria-label]="'nav.addFeather' | transloco" (click)="openUpload()">
      <app-icon name="feather-add" [size]="34" [strokeWidth]="2.4" />
    </button>
  </ion-tab-bar>
</ion-tabs>
