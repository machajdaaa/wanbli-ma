<ion-content>
  <div class="flex min-h-full flex-col px-4 pb-[calc(var(--wanbli-space-6)+var(--ion-safe-area-bottom,0px))]">
    <section class="flex flex-col items-center gap-1.5 pt-[max(4.75rem,calc(var(--ion-safe-area-top,0px)+2rem))] text-center">
      <img src="/assets/images/eagle-auth.png" alt="" class="mb-2.5 h-[140px] w-[168px]" />
      <h1 class="type-display text-text">{{ 'auth.loginTitle' | transloco }}</h1>
      <p class="font-text text-[0.9375rem] leading-5 text-text-muted">{{ 'auth.loginText' | transloco }}</p>
    </section>

    <form class="flex flex-col gap-4 pt-7" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-text-input
        formControlName="nickname"
        autocomplete="username"
        [label]="'auth.nickname' | transloco"
        [error]="errorFor('nickname')"
      />
      <app-text-input
        formControlName="password"
        type="password"
        autocomplete="current-password"
        [label]="'auth.password' | transloco"
        [error]="errorFor('password')"
      />
      <a
        routerLink="/forgot-password"
        class="-mt-3 -mr-1 -mb-2 inline-flex h-11 items-center self-end px-1 type-label text-text underline decoration-primary decoration-2 underline-offset-4"
        >{{ 'auth.forgotPassword' | transloco }}</a
      >
      <app-button type="submit" size="lg" [block]="true" [loading]="submitting()" class="mt-1">
        {{ (submitting() ? 'auth.loggingIn' : 'auth.login') | transloco }}
      </app-button>
    </form>

    <p class="mt-auto flex items-center justify-center gap-1.5 pt-8 type-body text-text-muted">
      {{ 'auth.noAccount' | transloco }}
      <a
        routerLink="/register"
        class="inline-flex h-11 items-center type-label text-text underline decoration-primary decoration-2 underline-offset-4"
        >{{ 'auth.toRegister' | transloco }}</a
      >
    </p>
  </div>
</ion-content>
