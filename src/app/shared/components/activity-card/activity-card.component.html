<div class="activity-card">
  <div class="flex flex-row items-center gap-2">
    @if (post().author.profilePicture) {
      <img class="avatar" [src]="post().author.profilePicture" alt="">
    } @else {
      <div class="avatar pic-placeholder"></div>
    }
    <h3 class="nickname type-label">{{ post().author.nickname }}</h3>
    <h3 class="created-at ml-auto type-caption text-text-muted">{{ post().createdAt | date:'d.M. HH:mm' }}</h3>
  </div>

  <p class="type-body text-text-muted">{{ post().content }}</p>

  @if (post().imageUrl) {
    <img class="post-image" [src]="post().imageUrl" alt="">
  }

  <div class="flex flex-row gap-4 mt-3">
    <h3 class="type-label">♥ {{ post().likeCount }}</h3>
    <h3 class="type-label">💬 {{ post().commentCount }}</h3>
  </div>
</div>
