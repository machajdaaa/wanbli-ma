<ion-input
  class="app-text-input"
  mode="md"
  [fill]="'outline'"
  [labelPlacement]="'floating'"
  [id]="inputId"
  [label]="label()"
  [type]="type()"
  [value]="value()"
  [disabled]="disabled()"
  [autocomplete]="autocomplete()"
  (ionInput)="handleInput($event)"
  (ionBlur)="handleBlur()">
</ion-input>
